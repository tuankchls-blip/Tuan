# Tạo bản tin tự động mỗi sáng và commit kết quả (data/ và docs/) vào repo.
# GitHub Pages đăng thư mục docs/ của nhánh main.
name: Bản tin AI hằng ngày

on:
  schedule:
    # Tránh đúng đầu giờ: GitHub hay trễ hàng giờ lúc 00:00 UTC vì quá tải.
    # Khung tin vẫn chốt lúc 07:00 giờ VN nên giờ chạy không làm đổi nội dung.
    - cron: "17 0 * * *" # 07:17 giờ Việt Nam
    - cron: "47 1 * * *" # 08:47 giờ Việt Nam, dự phòng: bỏ qua nếu bản hôm nay đã có
  workflow_dispatch:
    inputs:
      kind:
        description: "Loại bản tin"
        type: choice
        # due: các bản tổng hợp đến hạn; retranslate: dịch bù bản ngày đã lưu (cần nhập ngày)
        options: [daily, weekly, monthly, quarterly, yearly, due, retranslate, llm-check]
        default: daily
      date:
        description: "Ngày (YYYY-MM-DD). Bản ngày/due/retranslate: để trống = hôm nay; bản tổng hợp: ngày bất kỳ trong kỳ, để trống = kỳ vừa kết thúc"
        type: string
        required: false
      no_claude:
        description: "Không dịch bằng Claude (chỉ dùng Google)"
        type: boolean
        default: false

permissions:
  contents: write # để commit kết quả

concurrency:
  group: digest # không cho hai lần chạy chồng nhau
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Có secret token Claude hay không (secret không dùng trực tiếp trong `if:` được)
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Chạy test
        run: pytest -q

      # Chỉ cài Claude Code khi có token; không có thì dịch bằng Google
      - uses: actions/setup-node@v5
        if: env.HAS_CLAUDE_TOKEN == 'true'
        with:
          node-version: "22"

      - name: Cài Claude Code
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Tạo bản tin
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # giai đoạn 4 (tùy chọn)
          # Giá trị nhập tay được truyền qua biến môi trường, không chèn thẳng vào lệnh
          KIND: ${{ inputs.kind || 'daily' }}
          DIGEST_DATE: ${{ inputs.date }}
          NO_CLAUDE: ${{ inputs.no_claude || false }}
          EVENT: ${{ github.event_name }}
        run: |
          # Lịch chạy (cả lịch dự phòng) bỏ qua nếu bản tin hôm nay đã được tạo
          today=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)
          if [ "$EVENT" = "schedule" ] && [ -f "data/${today:0:4}/$today.json" ]; then
            echo "::notice::Bản tin $today đã có, bỏ qua lần chạy theo lịch này"; exit 0
          fi
          args=("$KIND")
          if [ -n "$DIGEST_DATE" ]; then
            if ! [[ "$DIGEST_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Ngày phải có dạng YYYY-MM-DD"; exit 1
            fi
            args+=(--date "$DIGEST_DATE")
          fi
          if [ "$NO_CLAUDE" = "true" ]; then
            args+=(--no-claude)
          elif [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::Không có secret CLAUDE_CODE_OAUTH_TOKEN: dịch bằng Google Translate"
            args+=(--no-claude)
          fi
          python main.py "${args[@]}"
          # Lịch hằng ngày: tạo thêm các bản tổng hợp đến hạn (Thứ Hai, ngày 1, đầu quý, đầu năm)
          if [ "$EVENT" = "schedule" ]; then
            python main.py due
          fi

      - name: Commit kết quả
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi"; exit 0
          fi
          git commit -m "Bản tin $(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d) (${{ inputs.kind || 'daily' }})"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Không đẩy được kết quả lên $BRANCH"; exit 1
