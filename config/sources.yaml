# Danh sách nguồn tin của ai-daily-digest.
# Thêm, bỏ hoặc tắt nguồn ở đây mà không cần sửa code.
#
# Các trường của mỗi nguồn:
#   id        mã ngắn, duy nhất, dùng trong dữ liệu JSON (không đổi sau khi đã chạy)
#   name      tên hiển thị trong bản tin
#   homepage  trang chủ của nguồn
#   group     nhóm: research | lab | infra | press | software | security | expert | community | vietnam
#   role      vai trò khi chấm điểm:
#               origin         nơi công bố gốc (lab, viện nghiên cứu)
#               peer_reviewed  tạp chí đã bình duyệt
#               official       cơ quan chính thức (CISA)
#               press          báo chí
#               expert         blog/bản tin chuyên gia
#               preprint       bài chưa bình duyệt, cần tín hiệu khác xác nhận (arXiv)
#               community      tín hiệu cộng đồng (Hacker News, HF Daily Papers)
#   weight    trọng số: 3 = nguồn gốc/bình duyệt · 2 = báo/chuyên gia uy tín · 1 = cộng đồng
#   lang      ngôn ngữ: en | vi
#   type      cách đọc:
#               rss         RSS hoặc Atom
#               hf_papers   API JSON của Hugging Face Daily Papers
#               hackernews  API Algolia của Hacker News
#               cisa_kev    file JSON danh mục CISA KEV
#               crossref    API Crossref, lọc theo ISSN của tạp chí
#               sitemap     sitemap.xml; chỉ lấy đường dẫn mới xuất hiện (nguồn không có RSS)
#   url       địa chỉ feed/API
#   enabled   false để tạm tắt nguồn
#   options   tùy chọn riêng cho từng type (xem từng nguồn)
#   fallback_urls  (tùy chọn) địa chỉ dự phòng, thử lần lượt khi địa chỉ chính lỗi
#
# Kết quả kiểm tra ngày 30/10/2026: cả 31 nguồn đều đọc được.

sources:
  # ---------------------------------------------------------------- Nghiên cứu
  - id: arxiv
    name: arXiv (cs.AI, cs.LG, cs.CL, cs.CV, cs.SE, cs.CR)
    homepage: https://arxiv.org
    group: research
    role: preprint
    weight: 2
    lang: en
    type: rss
    url: https://rss.arxiv.org/rss/cs.AI+cs.LG+cs.CL+cs.CV+cs.SE+cs.CR
    enabled: true
    options:
      # ~1.500 mục/ngày: chỉ giữ bài được HF Daily Papers, blog chuyên gia
      # hoặc Hacker News nhắc tới (xem settings.yaml > scoring.preprint).
      # Giờ đăng của arXiv là giờ công bố hôm sau, nên bài arXiv không lọc theo giờ.
      # Bỏ các mục chỉ là bản cập nhật của bài cũ:
      skip_announce_types: [replace, replace-cross]

  - id: hf-papers
    name: Hugging Face Daily Papers
    homepage: https://huggingface.co/papers
    group: research
    role: community
    weight: 2
    lang: en
    type: hf_papers
    url: https://huggingface.co/api/daily_papers
    enabled: true

  - id: nature-mi
    name: Nature Machine Intelligence
    homepage: https://www.nature.com/natmachintell/
    group: research
    role: peer_reviewed
    weight: 3
    lang: en
    type: rss
    url: https://www.nature.com/natmachintell.rss
    enabled: true

  - id: cacm
    name: Communications of the ACM
    homepage: https://cacm.acm.org
    group: research
    role: peer_reviewed
    weight: 3
    lang: en
    type: crossref
    # cacm.acm.org chặn đọc feed (403) và ACM DL không có RSS cho CACM,
    # nên dùng API công khai của Crossref theo ISSN.
    url: https://api.crossref.org/journals/0001-0782/works
    enabled: true
    options:
      rows: 50

  - id: quanta-cs
    name: Quanta Magazine – Computer Science
    homepage: https://www.quantamagazine.org/computer-science/
    group: research
    role: press
    weight: 3
    lang: en
    type: rss
    url: https://www.quantamagazine.org/computer-science/feed/
    enabled: true

  - id: mit-news-ai
    name: MIT News – AI
    homepage: https://news.mit.edu/topic/artificial-intelligence2
    group: research
    role: origin
    weight: 3
    lang: en
    type: rss
    url: https://news.mit.edu/topic/mitartificial-intelligence2-rss.xml
    enabled: true

  - id: bair
    name: Berkeley AI Research (BAIR)
    homepage: https://bair.berkeley.edu/blog/
    group: research
    role: origin
    weight: 3
    lang: en
    type: rss
    url: https://bair.berkeley.edu/blog/feed.xml
    enabled: true

  - id: stanford-hai
    name: Stanford HAI
    homepage: https://hai.stanford.edu/news
    group: research
    role: origin
    weight: 3
    lang: en
    type: sitemap
    # Không có RSS; dùng sitemap công khai, chỉ lấy đường dẫn /news/ mới xuất hiện.
    url: https://hai.stanford.edu/sitemap.xml
    enabled: true
    options:
      path_prefix: /news/

  # ---------------------------------------------------------------- Lab AI
  - id: deepmind
