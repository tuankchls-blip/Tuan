# Thuật ngữ có từ tiếng Việt phổ biến: dịch theo bảng này.
# Các thuật ngữ chung (open-source, large language model, alignment…) do bảng có sẵn của
# dichviet quyết định; chỉ ghi ở đây mục riêng của bản tin hoặc mục muốn đè lên dichviet.
preferred_translations:
  machine learning: học máy
  deep learning: học sâu
  artificial intelligence: trí tuệ nhân tạo
  dataset: bộ dữ liệu
  datasets: bộ dữ liệu
  neural network: mạng nơ-ron
  computer vision: thị giác máy tính
  reasoning: suy luận
  training: huấn luyện
  vulnerability: lỗ hổng
  data center: trung tâm dữ liệu
  semiconductor: bán dẫn
  open source: mã nguồn mở
