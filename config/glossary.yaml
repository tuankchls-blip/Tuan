# Thuật ngữ riêng của bản tin, nạp vào dichviet qua config/dichviet.yaml (extra_glossary),
# đè lên các bảng có sẵn của dichviet (ai, cntt, an-ninh-mang).
# - Claude nhận các mục xuất hiện trong lô kèm system prompt.
# - Với Google, MyMemory: keep_terms và proper_nouns được thay bằng mã giữ chỗ trước khi
#   dịch rồi trả lại nguyên văn; preferred_translations được thay bằng từ Việt.
# So khớp không phân biệt hoa thường, theo nguyên từ; cụm dài được ưu tiên trước.
# Kiểm tra mục trùng, mâu thuẫn: dichviet glossary lint --config config/dichviet.yaml

# Thuật ngữ kỹ thuật giữ nguyên tiếng Anh
keep_terms:
  - LLM
  - LLMs
  - Transformer
  - Transformers
  - fine-tuning
  - fine-tune
  - pre-training
  - benchmark
  - benchmarks
  - token
  - tokens
  - tokenizer
  - prompt
  - prompts
  - prompt injection
  - RAG
  - agent
  - agents
  - agentic
  - GPU
  - GPUs
  - TPU
  - CPU
  - CUDA
  - open-weight
  - CVE
  - zero-day
  - API
  - SDK
  - embedding
  - embeddings
  # inference giữ nguyên vì "suy luận" đã dành cho reasoning (thống nhất với dichviet)
  - inference
  - diffusion model
  - Mixture of Experts
  - MoE
  - RLHF
  - chain-of-thought
  - jailbreak
  - red teaming
  - Gaussian splatting
  - ransomware
  - malware
  - phishing

